[workspace]
members = ["crates/cuerithm-cleanup", "crates/cuerithm-autotag", "crates/camelot-core", "crates/camelot-cli", "crates/camelot-source-analysis", "crates/cuerithm-media", "crates/cuerithm-library", "apps/desktop/src-tauri"]
exclude = ["vendor/onetagger/onetagger-tag", "vendor/onetagger/onetagger-tagger", "vendor/onetagger/providers", "vendor/onetagger/template"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
rustfft = "6"
rubato = "0.16"
symphonia = { version = "0.5.5", features = ["all"] }
hound = "3.5"
tempfile = "3"
base64 = "0.22"

[profile.release]
debug = 1

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.camelot-core]
opt-level = 2

[profile.dev.package.camelot-source-analysis]
opt-level = 2
