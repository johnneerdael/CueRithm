name: Engine checks
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', '.github/PULL_REQUEST_TEMPLATE.md', '.github/scripts/**', '.github/workflows/pr-gate.yml', '.github/workflows/release.yml', '.github/workflows/pages.yml', 'mkdocs.yml', 'tools/release/**']
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine-rust-floor:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: engine-floor
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: rustup toolchain install 1.89 --profile minimal
      - run: cargo +1.89 check -p camelot-cli --all-features --locked
      - run: cargo +1.89 test -p cuerithm-maintenance --all-targets --locked
      - run: rustup toolchain install 1.90 --profile minimal
      - run: cargo +1.90 test -p cuerithm-rekordbox --all-targets --release --locked
  engine:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os == 'windows-2025' && vars.CLOUDRUNNER_WINDOWS_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","windows","x64","cloudrunner","cuerithm"]') || matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: engine-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/native-crypto-tools
      - uses: ./.github/actions/media-runtime
      - name: Verify native source build tooling
        run: cmake --version
      - name: Install Rust checks
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo +stable fmt --all -- --check
      - name: Lint
        run: cargo +stable clippy --workspace --exclude cuerithm-desktop --exclude cuerithm-library --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo +stable test --workspace --exclude cuerithm-desktop --exclude cuerithm-library --all-features --release --locked -- --test-threads=2
      - name: Cleanup overflow and debug regressions
        run: cargo +stable test -p cuerithm-cleanup --locked
      - name: Release build
        run: cargo +stable build --workspace --exclude cuerithm-desktop --exclude cuerithm-library --all-features --release --locked
