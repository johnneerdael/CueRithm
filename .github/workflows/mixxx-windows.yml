name: Mixxx on Windows

# Runs tools/mixxx-acceptance against the real Mixxx 2.5.6 for Windows, with the sync built by the
# MSVC toolchain the shipped Windows app uses (the test VM used for the GNU-toolchain runs cannot
# install the Visual Studio Build Tools without administrator rights). Mixxx's installer is checked
# against the checksum its download server publishes. Not part of the release gate.
on:
  push:
    branches: [main]
    paths:
      - 'crates/cuerithm-dj-sync/**'
      - 'tools/mixxx-acceptance/**'
      - '.github/workflows/mixxx-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mixxx-windows-${{ github.ref }}
  cancel-in-progress: true
env:
  CUERITHM_WIN_ROOT: D:\cuerithm-win
jobs:
  mixxx-windows:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: mixxx-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/native-crypto-tools
      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version --verbose
          cargo --version
      - name: Mixxx, FFmpeg and libmad
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./tools/mixxx-acceptance/windows/bootstrap.ps1 -Root $env:CUERITHM_WIN_ROOT -Toolchain msvc
      - name: Acceptance run against Mixxx 2.5.6
        shell: pwsh
        run: ./tools/mixxx-acceptance/windows/run.ps1 -Task acceptance -Root $env:CUERITHM_WIN_ROOT -Repo $env:GITHUB_WORKSPACE -Work "$env:CUERITHM_WIN_ROOT\work"
      - name: Result
        if: always()
        shell: pwsh
        run: |
          $log = "$env:CUERITHM_WIN_ROOT\acceptance.log"
          if (Test-Path $log) {
            Get-Content $log
            "## Mixxx 2.5.6 on Windows, MSVC build" | Add-Content $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY
            (rustc --version --verbose | Select-String '^(rustc|host)') | ForEach-Object { $_.Line } | Add-Content $env:GITHUB_STEP_SUMMARY
            (Get-Content $log | Select-String 'checks passed|FAIL|NOTE') | ForEach-Object { $_.Line } | Add-Content $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          }
      - name: Keep the run's files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mixxx-windows-acceptance
          path: |
            D:\cuerithm-win\acceptance.log
            D:\cuerithm-win\work\**\report.json
            D:\cuerithm-win\work\**\*.log
          if-no-files-found: warn
          retention-days: 7
