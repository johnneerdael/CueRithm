name: PR gate

# Cheap merge gate: PR body sections plus a completed @codex review of the head commit.
# Pushes start no builds. Once the gate passes it dispatches the hosted builds (ci.yml, desktop.yml) for
# that commit, and a newer commit cancels the old commit's unfinished runs. They also run after the merge.
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created, edited]
  # Resolving a thread fires no workflow event; recheck with `gh workflow run pr-gate.yml -f pr_number=N`.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to recheck'
        required: true

permissions:
  contents: read
  pull-requests: read
  statuses: write
  actions: write

concurrency:
  group: pr-gate-${{ inputs.pr_number || github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  gate:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Trusted scripts from main only; never check out or run PR code with this token.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Evaluate review and PR body
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/pr_gate.py --pr '${{ inputs.pr_number || github.event.pull_request.number || github.event.issue.number }}'
