name: Cloudrunner benchmark
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Source commit shared by hosted and AWS lanes'
        required: false
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled]
    paths: ['.github/workflows/cloudrunner-benchmark.yml']
permissions:
  contents: read
concurrency:
  group: cloudrunner-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
env:
  BENCHMARK_SHA: fc5975b1b183313c63c8f90a84579073f4c84cd2
  BENCHMARK_STAGE: ${{ vars.CLOUDRUNNER_WINDOWS_VCPU || '8' }}
jobs:
  smoke:
    if: >-
      github.event_name == 'pull_request' && github.event.action != 'labeled' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner
    strategy:
      fail-fast: false
      matrix:
        os: [windows, linux]
    runs-on: ${{ fromJSON(format('["self-hosted","{0}","x64","cloudrunner","cuerithm"]', matrix.os)) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.BENCHMARK_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/native-crypto-tools
      - name: Windows image and hardware
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Content C:\Cloudrunner\image.json
          Get-CimInstance Win32_ComputerSystem | Select-Object NumberOfLogicalProcessors, TotalPhysicalMemory
          foreach ($tool in @('git','aws','python','node','cmake','nasm','rustc','cargo','pwsh')) {
            & $tool --version
            if ($LASTEXITCODE) { throw $tool }
          }
      - name: Linux image and hardware
        if: runner.os == 'Linux'
        shell: bash
        run: |
          lscpu
          free -h
          git --version
          aws --version
          python --version
          cmake --version
          rustc --version
          cargo --version

  engine:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == github.repository_owner &&
       contains(github.event.pull_request.labels.*.name, 'cloudrunner-benchmark'))
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: windows-hosted
            os: windows-2025
            runner: '["windows-2025"]'
          - profile: windows-aws
            os: windows-2025
            runner: '["self-hosted","windows","x64","cloudrunner","cuerithm"]'
          - profile: linux-hosted
            os: ubuntu-24.04
            runner: '["ubuntu-24.04"]'
          - profile: linux-aws
            os: ubuntu-24.04
            runner: '["self-hosted","linux","x64","cloudrunner","cuerithm"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha || env.BENCHMARK_SHA }}
          persist-credentials: false
      - name: Confirm AWS Windows benchmark size
        if: matrix.profile == 'windows-aws'
        shell: pwsh
        env:
          EXPECTED_VCPU: ${{ env.BENCHMARK_STAGE }}
        run: |
          $computer = Get-CimInstance Win32_ComputerSystem
          $computer | Select-Object NumberOfLogicalProcessors, TotalPhysicalMemory
          if ($computer.NumberOfLogicalProcessors -ne [int]$env:EXPECTED_VCPU) {
            throw 'AWS instance size does not match the benchmark stage; check the Terraform pool.'
          }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cloudrunner-benchmark-engine-${{ matrix.profile }}-${{ env.BENCHMARK_STAGE }}
          save-if: true
      - uses: ./.github/actions/native-crypto-tools
      - uses: ./.github/actions/media-runtime
      - name: Verify native source build tooling
        run: cmake --version
      - name: Install Rust checks
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo +stable fmt --all -- --check
      - name: Lint
        run: cargo +stable clippy --workspace --exclude cuerithm-desktop --exclude cuerithm-library --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo +stable test --workspace --exclude cuerithm-desktop --exclude cuerithm-library --all-features --release --locked -- --test-threads=2
      - name: Cleanup overflow and debug regressions
        run: cargo +stable test -p cuerithm-cleanup --locked
      - name: Release build
        run: cargo +stable build --workspace --exclude cuerithm-desktop --exclude cuerithm-library --all-features --release --locked

  desktop:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == github.repository_owner &&
       contains(github.event.pull_request.labels.*.name, 'cloudrunner-benchmark'))
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: windows-hosted
            os: windows-2025
            runner: '["windows-2025"]'
          - profile: windows-aws
            os: windows-2025
            runner: '["self-hosted","windows","x64","cloudrunner","cuerithm"]'
          - profile: linux-hosted
            os: ubuntu-24.04
            runner: '["ubuntu-24.04"]'
          - profile: linux-aws
            os: ubuntu-24.04
            runner: '["self-hosted","linux","x64","cloudrunner","cuerithm"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    env:
      CARGO_PROFILE_RELEASE_DEBUG: 0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha || env.BENCHMARK_SHA }}
          persist-credentials: false
      - name: Confirm AWS Windows benchmark size
        if: matrix.profile == 'windows-aws'
        shell: pwsh
        env:
          EXPECTED_VCPU: ${{ env.BENCHMARK_STAGE }}
        run: |
          $computer = Get-CimInstance Win32_ComputerSystem
          $computer | Select-Object NumberOfLogicalProcessors, TotalPhysicalMemory
          if ($computer.NumberOfLogicalProcessors -ne [int]$env:EXPECTED_VCPU) {
            throw 'AWS instance size does not match the benchmark stage; check the Terraform pool.'
          }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cloudrunner-benchmark-desktop-${{ matrix.profile }}-${{ env.BENCHMARK_STAGE }}
          save-if: true
      - name: Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential cmake libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libasound2-dev
      - uses: ./.github/actions/native-crypto-tools
      - uses: ./.github/actions/media-runtime
      - name: Install pnpm
        shell: bash
        run: npm install --global pnpm@12.14.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Locked frontend dependencies
        shell: bash
        run: pnpm --dir apps/desktop install --frozen-lockfile
      - name: Rust checks
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Frontend tests and production build
        shell: bash
        run: |
          pnpm --dir apps/desktop test
          pnpm --dir apps/desktop build
      - name: Formatting and native bridge lint
        shell: bash
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable clippy -p cuerithm-desktop -p cuerithm-library -p cuerithm-rekordbox --all-targets --locked -- -D warnings
      - name: Tagging, decoder, worker, recovery and playback tests
        run: cargo +stable test -p cuerithm-autotag -p cuerithm-library -p cuerithm-media -p cuerithm-desktop -p cuerithm-rekordbox --release --locked -- --test-threads=2
      - name: Synthetic sync and linkage invariants
        shell: bash
        run: |
          python -m unittest discover -s tools/fixtures/rekordbox -v
          python -m unittest discover -s tools/media-runtime -v
