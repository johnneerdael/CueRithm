name: Desktop checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_PROFILE_RELEASE_DEBUG: 0
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential cmake libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libasound2-dev
      - uses: ./.github/actions/media-runtime
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Locked frontend dependencies
        shell: bash
        run: |
          npm install --global pnpm@12.14.0
          pnpm --dir apps/desktop install --frozen-lockfile
      - name: Rust checks
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Frontend tests and production build
        shell: bash
        run: |
          pnpm --dir apps/desktop test
          pnpm --dir apps/desktop build
      - name: Formatting and native bridge lint
        shell: bash
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable clippy -p cuerithm-desktop -p cuerithm-library --all-targets --locked -- -D warnings
      - name: Tagging, decoder, worker, recovery and playback tests
        run: cargo +stable test -p cuerithm-autotag -p cuerithm-library -p cuerithm-media -p cuerithm-desktop --release --locked -- --test-threads=2
      - name: Synthetic sync and linkage invariants
        shell: bash
        run: |
          python -m unittest discover -s tools/fixtures/rekordbox -v
          python -m unittest discover -s tools/media-runtime -v
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: pnpm --dir apps/desktop tauri build --bundles app
      - name: Verify macOS bundled resources
        if: runner.os == 'macOS'
        run: target/release/bundle/macos/Cuerithm.app/Contents/MacOS/cuerithm-desktop --diagnostics
      - name: Package Linux app
        if: runner.os == 'Linux'
        run: pnpm --dir apps/desktop tauri build --bundles deb
      - name: Verify extracted Linux resources
        if: runner.os == 'Linux'
        run: |
          mkdir -p .superpowers/linux-package
          dpkg-deb -x target/release/bundle/deb/*.deb .superpowers/linux-package
          .superpowers/linux-package/usr/bin/cuerithm-desktop --diagnostics
      - name: Build Windows portable app
        if: runner.os == 'Windows'
        run: pnpm --dir apps/desktop tauri build --no-bundle
      - name: Stage and verify Windows portable resources
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/release/bundle/portable | Out-Null
          Copy-Item target/release/cuerithm-desktop.exe target/release/bundle/portable/
          Copy-Item -Recurse tools/media-runtime/bin target/release/bundle/portable/media
          & target/release/bundle/portable/cuerithm-desktop.exe --diagnostics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package Mac artifact without losing executable modes
        if: runner.os == 'macOS'
        run: tar -czf target/release/bundle/Cuerithm-${{ runner.arch }}.app.tar.gz -C target/release/bundle/macos Cuerithm.app
      - name: Include matching application source
        shell: bash
        run: git archive --format=tar.gz -o target/release/bundle/cuerithm-source.tar.gz HEAD
      - name: Upload unsigned test artifacts and decoder source
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Cuerithm-test-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/release/bundle/*.app.tar.gz
            target/release/bundle/cuerithm-source.tar.gz
            target/release/bundle/deb/*.deb
            target/release/bundle/portable/**
            .superpowers/media-build/ffmpeg-9.0.2.tar.xz
            tools/media-runtime/
            THIRD_PARTY_NOTICES.md
            crates/camelot-core/vendor/soxr/LICENCE
            crates/camelot-core/vendor/soxr/COPYING.LGPL
            vendor/onetagger/LICENSE
            vendor/onetagger/UPSTREAM.json
            vendor/taglib/
