name: Desktop checks
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', '.github/PULL_REQUEST_TEMPLATE.md', '.github/scripts/**', '.github/workflows/pr-gate.yml', '.github/workflows/release.yml', 'tools/release/**']
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_PROFILE_RELEASE_DEBUG: 0
jobs:
  desktop:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: desktop-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential cmake libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libasound2-dev
      - uses: ./.github/actions/native-crypto-tools
      - uses: ./.github/actions/media-runtime
      - name: Install pnpm
        shell: bash
        run: npm install --global pnpm@12.14.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Locked frontend dependencies
        shell: bash
        run: pnpm --dir apps/desktop install --frozen-lockfile
      - name: Rust checks
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Frontend tests and production build
        shell: bash
        run: |
          pnpm --dir apps/desktop test
          pnpm --dir apps/desktop build
      - name: Formatting and native bridge lint
        shell: bash
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable clippy -p cuerithm-desktop -p cuerithm-library -p cuerithm-rekordbox --all-targets --locked -- -D warnings
      - name: Tagging, decoder, worker, recovery and playback tests
        run: cargo +stable test -p cuerithm-autotag -p cuerithm-library -p cuerithm-media -p cuerithm-desktop -p cuerithm-rekordbox --release --locked -- --test-threads=2
      - name: Synthetic sync and linkage invariants
        shell: bash
        run: |
          python -m unittest discover -s tools/fixtures/rekordbox -v
          python -m unittest discover -s tools/media-runtime -v
