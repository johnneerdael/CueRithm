name: Release

# After both post-merge check workflows pass for a main commit with user-facing release notes, builds the
# desktop packages and publishes a release (signed, notarized macOS; unsigned Linux and Windows).
# Internal-only changes never release by themselves; run this workflow manually to force one.
on:
  workflow_run:
    workflows: [Engine checks, Desktop checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'main commit to release (both check workflows must have passed)'
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && contains(fromJSON('["push","workflow_dispatch"]'), github.event.workflow_run.event))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ok: ${{ steps.ready.outputs.ok }}
      sha: ${{ env.SHA }}
      target: ${{ steps.ready.outputs.target }}
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ inputs.sha || github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
          persist-credentials: false
      # Release tooling always comes from main, so fixes apply to older green commits too.
      - name: Use release tooling from main
        run: |
          git fetch --no-tags origin main
          git checkout origin/main -- tools/release .github/scripts
      - name: Decide whether to release
        id: ready
        run: |
          ok=true
          for wf in ci.yml desktop.yml; do
            run=$(gh run list --workflow "$wf" --commit "$SHA" --status success --json databaseId,event --jq '[.[] | select(.event=="push" or .event=="workflow_dispatch")][0].databaseId')
            if [ -z "$run" ] || [ "$run" = null ]; then ok=false; fi
          done
          # Skip when this commit is already released or an equal/newer main commit was.
          if [ -n "$(git tag --points-at "$SHA")" ]; then ok=false; fi
          latest=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -n "$latest" ] && ! git merge-base --is-ancestor "$latest" "$SHA"; then ok=false; fi
          # GITHUB_TOKEN may only tag the tip of main (older commits can differ in workflow files).
          # Tag the tip when everything after the checked commit is release-only (the checks' paths-ignore set).
          target=$(git rev-parse origin/main)
          if ! git merge-base --is-ancestor "$SHA" "$target"; then ok=false; fi
          if git diff --name-only "$SHA" "$target" | grep -qvE '^(docs/|README\.md$|\.github/PULL_REQUEST_TEMPLATE\.md$|\.github/scripts/|\.github/workflows/(pr-gate|release|pages)\.yml$|mkdocs\.yml$|tools/release/)'; then ok=false; fi
          if [ -n "$(git tag --points-at "$target")" ]; then ok=false; fi
          # Automatic releases need at least one user-facing release note since the last release.
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && [ "$ok" = true ]; then
            [ "$(python3 .github/scripts/release_notes.py has-public --head "$target" --repo "$GITHUB_REPOSITORY")" = true ] || ok=false
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

  package:
    needs: gate
    if: needs.gate.outputs.ok == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/package.yml
    with:
      sha: ${{ needs.gate.outputs.sha }}

  publish:
    needs: [gate, package]
    runs-on: macos-15
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.gate.outputs.target }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download desktop builds
        run: gh run download "$GITHUB_RUN_ID" --pattern 'Cuerithm-test-*' --dir dist
      - name: Import Developer ID certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password=$(openssl rand -base64 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)
          [ -n "$identity" ] || { echo 'Developer ID identity not found' >&2; exit 1; }
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Sign and notarize
        env:
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          NOTARY_PRIVATE_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY }}
        run: |
          export NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8"
          printf '%s\n' "$NOTARY_PRIVATE_KEY" > "$NOTARY_KEY_PATH"
          trap 'rm -f "$NOTARY_KEY_PATH"' EXIT
          mkdir release
          sign() { tools/release/sign-macos.sh "$(find "dist/$1" -name '*.app.tar.gz')" "release/Cuerithm-$2.dmg"; }
          sign Cuerithm-test-macos-15 arm64
          # Unsigned Linux and Windows builds.
          cp "$(find dist/Cuerithm-test-ubuntu-24.04 -name '*.deb')" release/Cuerithm-linux-x64.deb
          (cd dist/Cuerithm-test-windows-2025/target/release/bundle/portable && zip -qr "$GITHUB_WORKSPACE/release/Cuerithm-windows-x64.zip" .)
          cp THIRD_PARTY_NOTICES.md release/
          # Corresponding source for the bundled decoder and the application.
          cp "$(find dist/Cuerithm-test-macos-15 -name cuerithm-source.tar.gz)" release/
          cp "$(find dist/Cuerithm-test-macos-15 -name 'ffmpeg-*.tar.xz')" release/
      - name: Publish release
        env:
          TARGET: ${{ needs.gate.outputs.target }}
        run: |
          base=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p;}' Cargo.toml)
          version=$(python3 .github/scripts/release_notes.py version --base "$base")
          python3 .github/scripts/release_notes.py notes --head "$TARGET" --repo "$GITHUB_REPOSITORY" --version "$version" > notes.md
          for f in release/Cuerithm-*.dmg release/Cuerithm-*.deb release/Cuerithm-*.zip; do mv "$f" "${f%.*}-$version.${f##*.}"; done
          gh release create "v$version" release/* --target "$TARGET" --title "Cuerithm $version" --notes-file notes.md --latest
      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
