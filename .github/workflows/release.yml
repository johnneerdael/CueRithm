name: Release

# Publishes a signed, notarized macOS release for a main commit once both post-merge build workflows pass for it.
on:
  workflow_run:
    workflows: [Engine checks, Desktop checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'main commit to release (both build workflows must have passed)'
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: macos-15
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ inputs.sha || github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require both build workflows to have passed for this commit
        id: ready
        run: |
          ok=true
          for wf in ci.yml desktop.yml; do
            run=$(gh run list --workflow "$wf" --commit "$SHA" --status success --json databaseId,event --jq '[.[] | select(.event=="push" or .event=="workflow_dispatch")][0].databaseId')
            if [ -z "$run" ] || [ "$run" = null ]; then ok=false; fi
            if [ "$wf" = desktop.yml ]; then echo "desktop_run=$run" >> "$GITHUB_OUTPUT"; fi
          done
          # Skip when this commit is already released or an equal/newer main commit was.
          if [ -n "$(git tag --points-at "$SHA")" ]; then ok=false; fi
          latest=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -n "$latest" ] && ! git merge-base --is-ancestor "$latest" "$SHA"; then ok=false; fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
      - name: Download macOS app builds
        if: steps.ready.outputs.ok == 'true'
        run: gh run download "${{ steps.ready.outputs.desktop_run }}" --pattern 'Cuerithm-test-macos-*' --dir dist
      - name: Import Developer ID certificate
        if: steps.ready.outputs.ok == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password=$(openssl rand -base64 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)
          [ -n "$identity" ] || { echo 'Developer ID identity not found' >&2; exit 1; }
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Sign and notarize
        if: steps.ready.outputs.ok == 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          NOTARY_PRIVATE_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY }}
        run: |
          export NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8"
          printf '%s\n' "$NOTARY_PRIVATE_KEY" > "$NOTARY_KEY_PATH"
          trap 'rm -f "$NOTARY_KEY_PATH"' EXIT
          mkdir release
          sign() { tools/release/sign-macos.sh "$(find "dist/$1" -name '*.app.tar.gz')" "release/Cuerithm-$2.dmg"; }
          sign Cuerithm-test-macos-15 arm64
          sign Cuerithm-test-macos-15-intel x64
          # Corresponding source for the bundled decoder and the application.
          cp "$(find dist/Cuerithm-test-macos-15 -name cuerithm-source.tar.gz)" release/
          cp "$(find dist/Cuerithm-test-macos-15 -name 'ffmpeg-*.tar.xz')" release/
      - name: Publish release
        if: steps.ready.outputs.ok == 'true'
        run: |
          base=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p;}' Cargo.toml)
          version=$(python3 .github/scripts/release_notes.py version --base "$base")
          python3 .github/scripts/release_notes.py notes --head "$SHA" --repo "$GITHUB_REPOSITORY" > notes.md
          for f in release/Cuerithm-*.dmg; do mv "$f" "${f%.dmg}-$version.dmg"; done
          gh release create "v$version" release/* --target "$SHA" --title "Cuerithm $version" --notes-file notes.md --latest
      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
