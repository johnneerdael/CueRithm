[package]
name = "cuerithm-desktop"
version.workspace = true
edition.workspace = true
rust-version = "1.90"
license = "GPL-3.0-only"

[lib]
name = "cuerithm_desktop_lib"

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
cuerithm-dj-sync = { path = "../../../crates/cuerithm-dj-sync" }
tauri = { version = "=2.12.2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "=2.7.2"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
base64.workspace = true
camelot-core = { path = "../../../crates/camelot-core", features = ["openkeyscan-key"] }
cuerithm-library = { path = "../../../crates/cuerithm-library", features = ["autotag"] }
cuerithm-autotag = { path = "../../../crates/cuerithm-autotag" }
cuerithm-cleanup = { path = "../../../crates/cuerithm-cleanup" }
cuerithm-media = { path = "../../../crates/cuerithm-media" }

[build-dependencies]
tauri-build = { version = "2", features = [] }
