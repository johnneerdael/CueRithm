[package]
name = "camelot-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
neural-beats = ["dep:beat-this"]
neural-key = ["dep:beat-this"]
openkeyscan-key = ["dep:rten", "dep:rten-tensor", "dep:cmake"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
rustfft.workspace = true
rubato.workspace = true
symphonia.workspace = true
camelot-source-analysis = { path = "../camelot-source-analysis" }
beat-this = { version = "=1.1.0", default-features = false, optional = true }
url = "2.5.8"

rten = { version = "=0.24.0", optional = true }
rten-tensor = { version = "=0.24.0", optional = true }

[build-dependencies]
sha2.workspace = true
cmake = { version = "=0.1.58", optional = true }

[dev-dependencies]
hound.workspace = true
roxmltree = "0.21.1"
