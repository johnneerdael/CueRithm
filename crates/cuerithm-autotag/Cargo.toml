[package]
name = "cuerithm-autotag"
version.workspace = true
edition.workspace = true
rust-version = "1.90"
license = "GPL-3.0-only"

[dependencies]
cuerithm-credentials = { path = "../cuerithm-credentials" }
scraper = "0.23"
base64.workspace = true
rusty-chromaprint = "=0.3.0"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
id3 = "1.17"
metaflac = "0.2.8"
lofty = "0.22"
sha2.workspace = true
mp4ameta = "0.13"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
cuerithm-cleanup = { path = "../cuerithm-cleanup" }
cuerithm-media = { path = "../cuerithm-media" }
onetagger-tag = { path = "../../vendor/onetagger/onetagger-tag", features = ["tag"] }
onetagger-tagger = { path = "../../vendor/onetagger/onetagger-tagger" }
reqwest = { version = "0.12", default-features = false, features = ["blocking","json","rustls-tls","stream"] }
regex = "1"
onetagger-selected-providers = { path = "../../vendor/onetagger/providers" }

tempfile.workspace = true
chrono = { version = "0.4", features = ["serde"] }

image = { version = "0.25", default-features = false, features = ["png","jpeg","gif","webp"] }

onetagger-template = { path = "../../vendor/onetagger/template" }

[build-dependencies]
cc = "1"
cmake = "0.1"
sha2.workspace = true
serde_json.workspace = true
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tempfile.workspace = true
flate2 = "1"
tar = "0.4"
id3 = "1.17"
