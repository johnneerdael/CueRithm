[package]
name = "cuerithm-dj-sync"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Authored Mixxx fixtures and the process-guard seam, for other crates' tests only.
test-support = []

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite = { workspace = true, features = ["functions", "backup", "bundled-sqlcipher-vendored-openssl"] }
sha2.workspace = true
tempfile.workspace = true
base64.workspace = true
flate2 = "1"
uuid = { version = "1", features = ["v4"] }
quick-xml = { version = "0.42", features = ["serialize"] }
lofty = "0.22.4"
sha1 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
cuerithm-rekordbox = { path = "../cuerithm-rekordbox" }
fs2 = "0.4"
camelot-core = { path = "../camelot-core" }
cuerithm-media = { path = "../cuerithm-media" }
same-file = "=1.0.6"
cuerithm-smartlists = { path = "../cuerithm-smartlists" }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
chrono-tz = { version = "=0.10.4", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Registry"] }

[dev-dependencies]
tar = "0.4"

[build-dependencies]
sha2.workspace = true
