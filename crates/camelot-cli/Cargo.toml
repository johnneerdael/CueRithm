[package]
name = "camelot-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
neural-beats = ["camelot-core/neural-beats"]
neural-key = ["camelot-core/neural-key"]
openkeyscan-key = ["camelot-core/openkeyscan-key"]

[[bin]]
name = "camelot"
path = "src/main.rs"

[dependencies]
camelot-core = { path = "../camelot-core" }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
hound.workspace = true
tempfile.workspace = true
